<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to MovieSphere and stream unlimited movies and TV shows.">
  <title>MovieSphere – Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Animated blurred background -->
  <div class="auth-bg"></div>

  <div class="auth-wrapper">

    <!-- Brand -->
    <div class="auth-brand">
      <span class="logo-icon">🎬</span>
      <a href="index.html" class="logo-text">Movie<span class="logo-accent">Sphere</span></a>
    </div>

    <!-- Card -->
    <div class="auth-card">
      <h2>Welcome back 👋</h2>
      <p class="auth-subtitle">Sign in to continue watching your favourites</p>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button class="pass-toggle" type="button" id="togglePass" onclick="togglePassword('password','togglePass')" aria-label="Toggle password visibility">👁️</button>
        </div>
      </div>

      <!-- Submit -->
      <button id="loginBtn" class="auth-submit" type="button">Sign In →</button>

      <!-- Message -->
      <p id="message" role="alert"></p>
    </div>

    <!-- Footer link -->
    <p class="auth-footer">
      Don't have an account? <a href="signup.html">Create Account</a>
    </p>

  </div>

  <script src="login.js"></script>
</body>
</html>
